[providers]
providers = ['node', 'python']

[apt]
packages = ['poppler-utils', 'libreoffice', 'qpdf', 'python3', 'python3-pip', 'python3-venv']

[phases.setup]
nixPkgs = ['...', 'python311Packages.pip']

[phases.install]
cmds = [
  'npm ci || npm install',
  'python3 -m venv /app/venv || python3 -m venv venv',
  './venv/bin/pip install -r requirements.txt || pip3 install -r requirements.txt'
]
