version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - CHROMA_URL=http://host.docker.internal:8000
      # Add any other environment variables your backend needs here, 
      # or mount your .env file below
    volumes:
      - ./.env:/app/.env
      - ./storage:/app/storage
